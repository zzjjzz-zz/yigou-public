[project]
name = "yigou-worker"
version = "0.2.0"
description = "Private JSON-lines SSH worker for Yigou"
requires-python = ">=3.12"
dependencies = ["netmiko>=4.6,<5", "paramiko>=5.1,<6"]

[project.scripts]
yigou-worker = "yigou_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
